services:
  - type: web
    name: acquy-thanhtu
    env: node
    region: singapore
    buildCommand: cd client && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
    # Thêm các biến sau trong Render Dashboard (Environment):
    # - MONGODB_URI
    # - JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
    # - PayOS credentials (nếu dùng)
    # - Các biến khác từ backend/.env
